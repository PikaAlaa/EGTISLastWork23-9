# ETIS LAN server reverse proxy (nginxinc/nginx-unprivileged, docs/design/docker-lan-v1.md §2.3, §7 Q1)
# - Listens only on 8443 with TLS 1.2 / 1.3
# - Disables access logging so submitted URLs, query parameters, or tokens are never written to disk
# - Blocks /extension/v1/* (loopback-only local browser extension routes) from the LAN
# - Routes /agent/v1/* directly to http://api:8000/agent/v1/* (Bearer token only, 512 KB cap, no X-API-Key/Cookie)
# - Routes / and /api/* to http://web:5173 (SOC console SPA and session proxy)

server {
    listen 8443 ssl;
    server_name _;

    server_tokens off;
    access_log off;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Local browser extension endpoints are strictly 127.0.0.1 loopback-only (browser-extension-v1.md §2.2).
    location ^~ /extension/v1 {
        access_log off;
        return 404;
    }

    # Windows LAN agent endpoints (windows-agent-lan-v1.md §5.1).
    location ^~ /agent/v1/ {
        access_log off;
        client_max_body_size 512k;
        add_header Cache-Control "no-store" always;

        proxy_pass http://api:8000/agent/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key "";
        proxy_set_header Cookie "";
    }

    # Built React console and operator /api/* session proxy (etis-frontend/server.mjs).
    location / {
        access_log off;
        client_max_body_size 64k;

        proxy_pass http://web:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto https;
    }
}
