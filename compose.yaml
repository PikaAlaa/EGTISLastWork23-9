services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: etis
      POSTGRES_USER: etis
      POSTGRES_PASSWORD: ${ETIS_DB_PASSWORD:?Set ETIS_DB_PASSWORD in .env}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etis -d etis"]
      interval: 10s
      retries: 5
  migrate:
    build: .
    environment: &api_environment
      DATABASE_URL: postgresql://etis:${ETIS_DB_PASSWORD}@database:5432/etis
      ETIS_API_KEY: ${ETIS_API_KEY:?Initialize the ignored .env first}
      ETIS_TEXT_MODEL: ${ETIS_TEXT_MODEL:-char}
    command: ["python", "scripts/initialize.py"]
    depends_on:
      database: {condition: service_healthy}
  api:
    build: .
    environment: *api_environment
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 30s
      retries: 3
  worker:
    build: .
    environment: *api_environment
    command: ["python", "data/scripts/manage_intelligence.py", "--watch"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: ./etis-frontend
    environment:
      ETIS_API_KEY: ${ETIS_API_KEY}
      ETIS_BACKEND_URL: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  database:
